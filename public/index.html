<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader - Facebook Reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .error.active {
            display: block;
        }

        .results {
            display: none;
            margin-top: 20px;
        }

        .results.active {
            display: block;
        }

        .media-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .thumbnail {
            max-width: 100%;
            border-radius: 10px;
            margin: 10px 0;
        }

        .media-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .type-video {
            background: #e3f2fd;
            color: #1976d2;
        }

        .type-audio {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .type-thumbnail {
            background: #e8f5e9;
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Media Downloader</h1>
        <p class="subtitle">Download Facebook Reels & Videos</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste Facebook Reel URL here...">
            <button id="downloadBtn" onclick="downloadMedia()">Download</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Fetching media...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results"></div>
    </div>

    <script>
        async function downloadMedia() {
            const urlInput = document.getElementById('urlInput');
            const downloadBtn = document.getElementById('downloadBtn');
            const loader = document.getElementById('loader');
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            const url = urlInput.value.trim();

            if (!url) {
                showError('Please enter a URL');
                return;
            }

            // Hide previous results
            errorDiv.classList.remove('active');
            resultsDiv.classList.remove('active');
            resultsDiv.innerHTML = '';

            // Show loader
            loader.classList.add('active');
            downloadBtn.disabled = true;

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.message || 'Failed to download media');
                }

                displayResults(data);
            } catch (error) {
                showError(error.message);
            } finally {
                loader.classList.remove('active');
                downloadBtn.disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (!data.data || data.data.length === 0) {
                showError('No media found');
                return;
            }

            let html = `<h3>Found ${data.total} media item(s)</h3>`;

            data.data.forEach((item, index) => {
                let type = 'video';
                let typeClass = 'type-video';
                let mediaUrl = item;

                if (typeof item === 'string') {
                    if (item.startsWith('audio===')) {
                        type = 'audio';
                        typeClass = 'type-audio';
                        mediaUrl = item.replace('audio===', '');
                    } else if (item.match(/\.(jpg|jpeg|png|gif|webp)/i)) {
                        type = 'thumbnail';
                        typeClass = 'type-thumbnail';
                    }
                }

                html += `
                    <div class="media-item">
                        <span class="media-type ${typeClass}">${type.toUpperCase()}</span>
                        ${type === 'thumbnail' ? `<img src="${mediaUrl}" class="thumbnail" alt="Thumbnail">` : ''}
                        <p><strong>URL:</strong> ${mediaUrl.substring(0, 100)}...</p>
                        <a href="${mediaUrl}" class="download-btn" target="_blank" download>
                            Download ${type}
                        </a>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
            resultsDiv.classList.add('active');
        }

        // Allow Enter key to trigger download
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                downloadMedia();
            }
        });
    </script>
</body>
</html>
